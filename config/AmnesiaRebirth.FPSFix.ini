; AmnesiaRebirth.FPSFix configuration
; Keep this file beside AmnesiaRebirth.FPSFix.asi. Changes apply on the next
; launch.

[General]
; false disables the fix completely without removing any file.
Enabled = true
; Writes detailed counters to AmnesiaRebirth.FPSFix.log every few seconds.
; Nothing else changes. Turn on only when reporting a problem.
Diagnostics = false

[Telemetry]
; Nothing in this section changes what the fix does.
; Logs frame-time statistics every ReportIntervalSeconds.
Enabled = false
ReportIntervalSeconds = 5
; Reserved.
MotionTrace = false

[Features]
; Lets the game draw faster than its fixed simulation rate. Everything below
; depends on it. Use VSync, an external frame limiter, or the limiter in
; [Timing] with it.
RenderUnlock = true
; Smooths the camera between simulation ticks, including scripted cameras.
CameraInterpolation = true
; Smooths the first-person body, held items, worn accessories, notes being
; read, and script-moved objects.
HandsRootInterpolation = true
; Smooths the first-person body's animation (arms, hands, legs).
HandsPoseInterpolation = true
; Smooths physics objects: thrown, carried, pushed, and falling props.
WorldRootInterpolation = true
; Smooths animated and jointed props and the animation and movement of
; creatures and characters.
RagdollPoseInterpolation = true
; Smooths particles: fire, smoke, dust, sparks, water.
ParticleInterpolation = true
; Mouse look at the display rate instead of the simulation rate, and menu,
; pause-menu, and inventory cursors (with dragged items) at the display rate.
; For the most direct mouse look, also turn Smooth Mouse off in the game's
; input options; with it on, the game's own smoothing is kept.
MouseOverlay = true
; Optional built-in frame limiter. To use it, set this to true and set
; TargetFPS under [Timing]. Leave it off when using VSync or an external
; limiter.
PresentationLimiter = false

; Not implemented. Setting any of these to true disables the whole fix.
WorldPoseInterpolation = false
VerletInterpolation = false
TemporalEffectTiming = false

[Timing]
; Frame rate for PresentationLimiter (1..1000). Must be above 0 when the
; limiter is on; ignored otherwise.
TargetFPS = 0
